name: Exoplanet RF paired-injection transfer (experiment 30)

on:
  push:
    branches:
      - reviewer-revision
    paths:
      - 'revision/30_rf_paired_injection_response.py'
      - 'revision/30a_test_rf_paired_injection_response.py'
      - '.github/workflows/rf-paired-injection-exp30.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rf-paired-injection-exp30
  cancel-in-progress: false

jobs:
  paired-injection:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reviewer-revision
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.4,<2' 'matplotlib>=3.9,<4'
      - name: Validate source and injection provenance
        run: |
          python -m py_compile revision/30_rf_paired_injection_response.py revision/30a_test_rf_paired_injection_response.py
          python -u revision/30a_test_rf_paired_injection_response.py
      - name: Run source-disjoint RF transfer analysis
        run: |
          python -u revision/30_rf_paired_injection_response.py
          test -s results/rf_paired_injection_response/RF_injection_transfer_report.md
          test -s results/rf_paired_injection_response/paired_126_injection_RF_predictions.csv
      - name: Commit outputs to the same review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/rf_paired_injection_response/
          if git diff --cached --quiet; then
            echo "No changed results to commit"
          else
            git commit -m "results: source-disjoint RF responses to 126 matched physical injections"
            git push origin HEAD:reviewer-revision
          fi
